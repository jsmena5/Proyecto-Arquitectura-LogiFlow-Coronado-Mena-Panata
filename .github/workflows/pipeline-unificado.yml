name: Pipeline Unificado SonarCloud

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "main" ]

# Prevenir ejecuciones duplicadas
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. COMPILACIÓN Y PRUEBAS EN PARALELO
  build-and-test:
    name: Build & Test --- ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ 'ms-flota-restA', 'ms-taller-restdos' ]
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y testear microservicio
        run: |
          cd ${{ matrix.service }}
          mvn clean test jacoco:report  # Asegura que se genere el reporte

      # Guardar reportes de cobertura para después
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/

  # 2. ANÁLISIS DE CALIDAD
  analisis-sonarcloud:
    name: Analisis SonarCloud
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Descargar reportes de cobertura
      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          path: coverage-reports

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Analizar Flota - CORREGIDO
      - name: Analizar ms-flota-restA en SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd ms-flota-restA
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=jsmena5_Proyecto-Arquitectura-LogiFlow-Coronado-Mena-Panata \
            -Dsonar.organization=jsmena5 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.binaries=target/classes

      # Analizar Taller - CORREGIDO
      - name: Analizar ms-taller-restdos en SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd ms-taller-restdos
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=jsmena5_Proyecto-Arquitectura-LogiFlow-Coronado-Mena-Panata-taller \
            -Dsonar.organization=jsmena5 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.binaries=target/classes

  # 3. NOTIFICACIÓN
  notificacion-telegram:
    name: Notificar a Telegram
    needs: analisis-sonarcloud
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensaje de Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *🚀 Reporte LogiFlow - ESPE*
            *Estado del Pipeline:* `${{ needs.analisis-sonarcloud.result == 'success' && '✅ ÉXITO' || '❌ FALLO' }}`
            *Rama:* `${{ github.ref_name }}`
            *Autor:* ${{ github.actor }}
            *Cobertura:* Ver SonarCloud para detalles