name: Pipeline Unificado SonarCloud

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. COMPILACIÓN Y PRUEBAS EN PARALELO (Nodo doble)
  build-and-test:
    name: Build & Test --- ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Carpetas exactas de los dos microservicios
        service: [ 'ms-flota-restA', 'ms-taller-restdos' ]
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y testear microservicio
        run: |
          cd ${{ matrix.service }}
          mvn clean test

  # 2. ANÁLISIS DE CALIDAD (Nodo central)
  analisis-sonarcloud:
    name: Analisis SonarCloud
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para el historial de SonarCloud

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Analiza el microservicio de Flota apuntando al repo de jsmena5
      - name: Analizar ms-flota-restA en SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=jsmena5_Proyecto-Arquitectura-LogiFlow-Coronado-Mena-Panata \
          -Dsonar.organization=jsmena5 \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
          -f ms-flota-restA/pom.xml

      # Analiza el microservicio de Taller apuntando al repo de jsmena5
      - name: Analizar ms-taller-restdos en SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=jsmena5_Proyecto-Arquitectura-LogiFlow-Coronado-Mena-Panata-taller \
          -Dsonar.organization=jsmena5 \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
          -f ms-taller-restdos/pom.xml

  # 3. NOTIFICACIÓN A TELEGRAM (Nodo final)
  notificacion-telegram:
    name: Notificar a Telegram
    needs: analisis-sonarcloud
    if: always() # Se ejecuta sin importar si los pasos anteriores fallan o pasan
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensaje de Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *🚀 Reporte LogiFlow - ESPE*
            *Estado del Pipeline:* `${{ job.status == 'success' && '✅ ÉXITO' || '❌ FALLO' }}`
            *Rama:* `${{ github.ref_name }}`
            *Autor del Push:* ${{ github.actor }}
            
            *📊 Análisis de Calidad:* SonarCloud Ejecutado para Flota y Taller
            *Enlace:* [Ver logs de GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})