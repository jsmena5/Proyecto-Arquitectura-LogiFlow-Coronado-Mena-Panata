name: Pipeline Unificado SonarCloud

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  # 1. COMPILACIÓN Y PRUEBAS EN PARALELO
  build-and-test:
    name: Build & Test --- ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ 'ms-clientes', 'ms-auth' ]
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y testear microservicio
        run: |
          cd ${{ matrix.service }}
          mvn clean test

  # 2. ANÁLISIS DE CALIDAD EN SONARCLOUD
  analisis-sonarcloud:
    name: Analisis SonarCloud
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Analiza el microservicio de Clientes
      - name: Analizar ms-clientes en SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=michaelandrescoronado_ms-clientes \
          -Dsonar.organization=michaelandrescoronado \
          -Dsonar.host.url=https://sonarcloud.io \
          -f ms-clientes/pom.xml

      # Analiza el microservicio de Autenticación
      - name: Analizar ms-auth en SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=michaelandrescoronado_ms-auth \
          -Dsonar.organization=michaelandrescoronado \
          -Dsonar.host.url=https://sonarcloud.io \
          -f ms-auth/pom.xml

      # Notificación a Telegram
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        if: always()
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Pipeline LogiFlow Ejecutado
            Microservicios: ms-clientes y ms-auth
            Responsable: Michael Coronado
            Estado: ${{ job.status }}
            Rama: ${{ github.ref_name }}